services:
  treehouse-library:
    build: ./treehouse-library
    container_name: treehouse-library
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - /home/treehouse/Documents/TreehouseLibrary-main/library.db:/app/library.db
      - /home/treehouse/Documents/TreehouseLibrary-main/.env:/app/.env:ro

  chess-mcp:
    build: ./chess-mcp
    container_name: chess-mcp
    restart: unless-stopped
    ports:
      - "8001:8000"
    env_file: ./chess-mcp.env
    volumes:
      - chess-data:/data

  skylight-mcp:
    build: ./skylight-mcp
    container_name: skylight-mcp
    restart: unless-stopped
    ports:
      - "8002:8000"
    env_file: ./skylight-mcp.env

  # Voice control for the Dreame vacuum. Bridge-networked like the other MCPs;
  # reaches matter-server (which is on host networking) via host.docker.internal.
  dreame-mcp:
    build: ./dreame-mcp
    container_name: dreame-mcp
    restart: unless-stopped
    ports:
      - "8003:8000"
    env_file: ./dreame-mcp.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - matter-server

  # Voice control for the two Nest thermostats. Unlike the vacuum this one is
  # cloud-bound: Nest offers no local API for pre-2024 thermostats, so every
  # command goes out through Google's SDM API and an internet outage takes it
  # out. No matter-server dependency for the same reason.
  nest-mcp:
    build: ./nest-mcp
    container_name: nest-mcp
    restart: unless-stopped
    ports:
      - "8004:8000"
    env_file: ./nest-mcp.env

  # Voice control for Goodreads. Goodreads retired its public API in 2020, so
  # this drives a real signed-in Chromium instead -- which is why it needs a
  # persistent profile volume (the session) and the Wayland socket (so the
  # headed sign-in can appear on the touchscreen when the session expires).
  goodreads-mcp:
    build: ./goodreads-mcp
    container_name: goodreads-mcp
    restart: unless-stopped
    ports:
      - "8005:8000"
    env_file: ./goodreads-mcp.env
    volumes:
      - goodreads-profile:/profile
      - /run/user/1000:/run/user/1000
    environment:
      # Only consumed by authenticate.py; the server never renders anything.
      WAYLAND_DISPLAY: wayland-0
      XDG_RUNTIME_DIR: /run/user/1000
    # Chromium wants more than Docker's default 64MB of shared memory and
    # crashes with cryptic renderer errors below about 256MB.
    shm_size: 512m

  # Calorie tracking against Lose It!. Plain httpx, no browser: the web app's
  # backend is reachable with the cookies its own login endpoint hands out.
  # The volume is not optional bookkeeping -- Lose It! rate-limits sign-ins
  # (Cloudflare 1015), so the cached session is what keeps a rebuild from
  # locking the server out for several minutes.
  loseit-mcp:
    build: ./loseit-mcp
    container_name: loseit-mcp
    restart: unless-stopped
    ports:
      - "8007:8000"
    env_file: ./loseit-mcp.env
    volumes:
      - loseit-session:/session

  # Workout logging, and the only service here that serves a human-facing UI
  # through the tunnel as well as an MCP endpoint. Both come off the same
  # process on the same port -- the dashboard's routes are inserted ahead of
  # FastMCP's, the way /healthz already is everywhere else -- so /mcp keeps
  # bearer auth while / and /api sit behind HTTP Basic Auth.
  #
  # The volume is the entire workout history. Nothing reconstructs it: unlike
  # loseit-session or goodreads-profile there is no upstream account holding a
  # copy, so this is the one volume here whose loss is permanent data loss.
  workout-mcp:
    build: ./workout-mcp
    container_name: workout-mcp
    restart: unless-stopped
    ports:
      - "8008:8000"
    env_file: ./workout-mcp.env
    volumes:
      - workout-data:/data

  # Matter controller. Talks to Matter devices (currently the Dreame vacuum)
  # over the LAN and exposes a WebSocket API on port 5580 for dreame-mcp.
  #
  # network_mode: host is REQUIRED, not a convenience -- Matter relies on
  # IPv6 link-local multicast and mDNS, which do not survive Docker's bridge
  # NAT. For the same reason wlan0 needs IPv6 enabled on the host (see README).
  #
  # NOTE: python-matter-server was archived 2026-06-23; 8.1.2 is its final
  # release. Its successor, matterjs-server, is a drop-in replacement with a
  # compatible WebSocket API, so migrating later is an image swap plus a
  # re-test -- no changes needed in dreame-mcp. Staying on the certified
  # stable release until matterjs-server leaves beta.
  matter-server:
    image: ghcr.io/matter-js/python-matter-server:stable
    container_name: matter-server
    restart: unless-stopped
    network_mode: host
    security_opt:
      # Needed for Bluetooth commissioning via D-Bus.
      - apparmor:unconfined
    volumes:
      - matter-data:/data
      - /run/dbus:/run/dbus:ro
    # --primary-interface wlan0: the Pi is on WiFi, and this is what IPv6
    # link-local addresses get scoped to when a device reports one without a
    # usable scope_id. Without it the server logs "Using 'None' as primary
    # interface" and can fail to reach devices by link-local address.
    command: --storage-path /data --paa-root-cert-dir /data/credentials --bluetooth-adapter 0 --primary-interface wlan0

volumes:
  chess-data:
  goodreads-profile:
  matter-data:
  loseit-session:
  workout-data:
